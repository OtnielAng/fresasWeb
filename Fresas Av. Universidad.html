<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fresas Av. Universidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Bricolage Grotesque"', '"Trebuchet MS"', 'system-ui', 'sans-serif'],
          body: ['Figtree', 'system-ui', '-apple-system', '"Segoe UI"', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
  html { scroll-behavior: smooth; }
  body { background: #fff1f2; color: #4c0519; font-family: "Figtree", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  :focus-visible { outline: 3px solid #e11d48; outline-offset: 3px; }

  /* Textos del pedido: el que sale se desvanece y despues entra el nuevo.
     data-mode="a" = elegir tamano, "b" = toppings / resumen */
  #panel .txt-a, #panel .txt-b { opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s linear .2s; }
  #panel[data-mode="a"] .txt-a, #panel[data-mode="b"] .txt-b { opacity: 1; visibility: visible; transition: opacity .3s ease .3s, visibility 0s linear .3s; }

  /* La fila del tamano elegido se abre solo en modo b */
  .collapse-row { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s ease; }
  #panel[data-mode="b"] .collapse-row { grid-template-rows: 1fr; }

  /* El mismo boton cambia de "Agregar topping" a "Ordenar por WhatsApp" */
  #mainBtn { background: transparent; color: #e11d48; border: 1.5px solid #e11d48; transition: background-color .3s ease, color .3s ease, border-color .3s ease; }
  #panel[data-mode="b"] #mainBtn { background: #059669; color: #fff; border-color: #059669; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    #panel .txt-a, #panel .txt-b, .collapse-row, #mainBtn { transition: none !important; }
  }
</style>

<main class="mx-auto flex max-w-[480px] flex-col gap-7 py-7">

  <!-- Zona que se desliza: toppings (izquierda) y hero (derecha) -->
  <div id="viewport" class="overflow-hidden">
    <div id="track" class="flex w-[200%] -translate-x-1/2 items-start transition-transform duration-500 ease-[cubic-bezier(.65,0,.35,1)] motion-reduce:transition-none">

      <section id="toppingsScreen" inert class="flex h-0 w-1/2 flex-col gap-5 overflow-hidden px-5" aria-label="Toppings">
        <button id="backBtn" type="button" class="flex items-center gap-1 self-start border-0 bg-transparent p-0 text-[0.9375rem] font-semibold text-rose-600">
          <span class="text-3xl leading-none" aria-hidden="true">‹</span>Volver
        </button>
        <div>
          <h2 class="m-0 font-display text-3xl font-extrabold leading-tight text-rose-600">Elige tus toppings</h2>
          <p class="m-0 mt-1 text-sm text-rose-900/70">Desliza para ver los 15. Toca para agregar o quitar.</p>
        </div>
        <div class="relative overflow-hidden rounded-3xl p-4">
          <div id="oil" class="absolute inset-0 bg-rose-100" aria-hidden="true"></div>
          <div class="relative -mx-4 overflow-x-auto px-4 pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
            <div id="topRows" class="flex w-max flex-col gap-3"></div>
          </div>
        </div>
      </section>

      <section id="heroScreen" class="flex w-1/2 flex-col gap-7 px-5">
        <header class="grid grid-cols-[minmax(0,1.15fr)_minmax(0,1fr)] items-start gap-4">
          <div class="flex min-w-0 flex-col gap-2">
            <h1 class="font-display text-5xl font-extrabold leading-none tracking-tight text-rose-600">Fresas</h1>
            <p class="text-[0.8125rem] font-semibold uppercase tracking-[0.08em] text-rose-900/70">Postres · Fruta</p>
            <a href="https://maps.app.goo.gl/jv686MCvtEfcYYXD7" target="_blank" rel="noopener"
               class="mt-1 text-sm font-medium underline decoration-rose-300 decoration-2 underline-offset-4 hover:decoration-rose-600">
              C. Macedonio Alcalá 102, RUTA INDEPENDENCIA, Centro, 68000 Oaxaca de Juárez, Oax.
            </a>
          </div>
          <!-- Cambia el src por tu imagen del hero -->
          <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Imagen de ejemplo"
               class="aspect-square w-full rounded-3xl bg-gradient-to-br from-rose-200 to-rose-400 object-cover">
        </header>
        <a href="#pedido" class="self-start rounded-full bg-rose-600 px-7 py-3.5 text-[1.0625rem] font-semibold text-white no-underline transition-transform active:scale-[.97] motion-reduce:transition-none">Ordena ya</a>
      </section>

    </div>
  </div>

  <!-- Pedido: se queda fija, solo cambia el texto -->
  <section id="pedido" aria-label="Arma tu pedido" class="scroll-mt-5 px-5">
    <div id="tabs" role="tablist" aria-label="Sabores" class="relative z-10 grid grid-cols-3 items-end"></div>

    <div id="panel" data-mode="a" role="tabpanel" class="flex flex-col gap-5 rounded-b-3xl bg-rose-100 p-5">

      <div class="grid">
        <p id="sizeName" aria-live="polite" class="txt-a col-start-1 row-start-1 m-0 text-center font-display text-2xl font-extrabold"></p>
        <p class="txt-b col-start-1 row-start-1 m-0 text-center font-display text-2xl font-extrabold">Tu pedido</p>
      </div>

      <div>
        <div class="grid grid-cols-[minmax(0,1fr)_140px_minmax(0,1fr)] items-end gap-1">
          <div class="grid items-end">
            <div class="txt-a col-start-1 row-start-1">
              <button id="prev" type="button" aria-label="Tamaño más grande" class="flex min-h-16 w-full flex-col items-center justify-end border-0 bg-transparent pb-1 text-[0.9375rem] font-semibold disabled:invisible">
                <span class="text-4xl leading-none text-rose-600" aria-hidden="true">‹</span>
                <span id="prevLabel"></span>
              </button>
            </div>
            <div class="txt-b col-start-1 row-start-1 pb-2">
              <p class="m-0 text-xs font-semibold uppercase tracking-[0.08em] text-rose-900/70">Producto</p>
              <p id="bName" class="m-0 font-display text-base font-extrabold leading-tight"></p>
            </div>
          </div>

          <div class="flex h-[190px] items-end justify-center">
            <!-- Cambia el src por la foto del vaso -->
            <img id="cupImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Vaso de ejemplo"
                 class="h-[180px] w-[140px] origin-bottom bg-gradient-to-b from-rose-300 to-rose-500 object-cover transition-transform duration-300 [clip-path:polygon(0_0,100%_0,84%_100%,16%_100%)] motion-reduce:transition-none">
          </div>

          <div class="grid items-end">
            <div class="txt-a col-start-1 row-start-1">
              <button id="next" type="button" aria-label="Tamaño más chico" class="flex min-h-16 w-full flex-col items-center justify-end border-0 bg-transparent pb-1 text-[0.9375rem] font-semibold disabled:invisible">
                <span class="text-4xl leading-none text-rose-600" aria-hidden="true">›</span>
                <span id="nextLabel"></span>
              </button>
            </div>
          </div>
        </div>

        <div class="collapse-row">
          <div class="min-h-0 overflow-hidden">
            <div class="txt-b pt-4">
              <p class="m-0 text-xs font-semibold uppercase tracking-[0.08em] text-rose-900/70">Tamaño</p>
              <p id="bSize" class="m-0 text-lg font-semibold"></p>
            </div>
          </div>
        </div>
      </div>

      <article class="flex flex-col gap-3 rounded-2xl bg-white/70 p-4">
        <div class="grid">
          <div class="txt-a col-start-1 row-start-1 flex flex-col gap-2">
            <h2 id="pName" class="m-0 font-display text-[1.375rem] font-extrabold leading-tight"></h2>
            <p id="pDesc" class="m-0 text-[0.9375rem] text-rose-900/75"></p>
            <p id="pPicked" hidden class="m-0 font-semibold"></p>
          </div>
          <div class="txt-b col-start-1 row-start-1">
            <p class="m-0 text-xs font-semibold uppercase tracking-[0.08em] text-rose-900/70">Toppings</p>
            <div id="sumToppings" class="mt-1.5 flex flex-wrap gap-2"></div>
          </div>
        </div>

        <!-- Un solo boton: en modo a agrega toppings, en modo b abre WhatsApp. Pon tu número en WHATSAPP_NUMBER (script) -->
        <a id="mainBtn" href="#pedido" target="_blank" rel="noopener"
           class="grid rounded-2xl px-4 py-3 text-center font-semibold no-underline">
          <span class="txt-a col-start-1 row-start-1">Agregar topping</span>
          <span class="txt-b col-start-1 row-start-1">Ordenar por WhatsApp</span>
        </a>
      </article>
    </div>
  </section>
</main>

<script>
  /* Tu número de WhatsApp con lada de país, sin + ni espacios. Ej: 5219510000000 */
  var WHATSAPP_NUMBER = '52XXXXXXXXXX';

  var FLAVORS = [
    { tab: 'Fresas con crema', name: 'Fresa con crema', desc: 'Fresas frescas en rebanadas con crema batida y una galleta de barquillo.' },
    { tab: 'Uva con crema', name: 'Uva con crema', desc: 'Uvas verdes y moradas con crema, servidas bien frías.' },
    { tab: 'Especialidades', name: 'Especialidad de la casa', desc: 'Fresas con chocolate, crema y barquillo. Cambia cada temporada.' }
  ];
  var SIZES = [
    { name: 'Grande', scale: 1 },
    { name: 'Mediano', scale: 0.82 },
    { name: 'Chico', scale: 0.66 }
  ];
  /* 15 toppings: 7 en la fila de arriba, 8 en la de abajo */
  var TOPPINGS = ['Chocolate', 'Lechera', 'Cajeta', 'Granola', 'Nuez', 'Almendra', 'Coco rallado',
                  'Chispas', 'Gomitas', 'Galleta', 'Plátano', 'Kiwi', 'Mango', 'Zarzamora', 'Malvaviscos'];
  var TONES = ['from-rose-200 to-rose-400', 'from-amber-200 to-amber-400', 'from-orange-200 to-orange-400', 'from-fuchsia-200 to-fuchsia-400', 'from-lime-200 to-lime-400'];
  var GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  var state = { flavor: 0, size: 1, picked: [], mode: 'a' };
  var waUrl = '#';
  var el = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var TAB_BASE = 'relative flex min-h-[68px] items-center justify-center px-2 pb-3 pt-3 text-center text-[0.8125rem] font-semibold leading-tight transition-colors motion-reduce:transition-none ';
  var TAB_OFF = 'text-rose-900/70 hover:bg-rose-100/60 rounded-t-2xl';
  var TAB_ON = 'rounded-t-3xl bg-rose-100 text-rose-950 ';
  var FLARE_L = "before:absolute before:bottom-0 before:right-full before:h-4 before:w-4 before:rounded-br-2xl before:shadow-[0.5rem_0.5rem_0_0.5rem_#ffe4e6] before:content-[''] ";
  var FLARE_R = "after:absolute after:bottom-0 after:left-full after:h-4 after:w-4 after:rounded-bl-2xl after:shadow-[-0.5rem_0.5rem_0_0.5rem_#ffe4e6] after:content-[''] ";
  var PANEL = 'flex flex-col gap-5 rounded-b-3xl bg-rose-100 p-5 ';

  /* ---------- pedido ---------- */
  function renderTabs() {
    el('tabs').innerHTML = FLAVORS.map(function (f, i) {
      var on = i === state.flavor;
      var cls = TAB_BASE + (on ? TAB_ON + (i > 0 ? FLARE_L : '') + (i < FLAVORS.length - 1 ? FLARE_R : '') : TAB_OFF);
      return '<button class="' + cls + '" role="tab" type="button" data-i="' + i + '" aria-selected="' + on + '">' + f.tab + '</button>';
    }).join('');
    el('panel').className = PANEL + (state.flavor === 0 ? 'rounded-tl-none ' : 'rounded-tl-3xl ') + (state.flavor === FLAVORS.length - 1 ? 'rounded-tr-none' : 'rounded-tr-3xl');
  }
  function renderSize() {
    var s = SIZES[state.size], p = SIZES[state.size - 1], n = SIZES[state.size + 1];
    el('sizeName').textContent = s.name;
    el('bSize').textContent = s.name;
    el('cupImg').style.transform = 'scale(' + s.scale + ')';
    el('prev').disabled = !p; el('next').disabled = !n;
    el('prevLabel').textContent = p ? p.name : '';
    el('nextLabel').textContent = n ? n.name : '';
  }
  function renderProduct() {
    var f = FLAVORS[state.flavor];
    el('pName').textContent = f.name;
    el('bName').textContent = f.name;
    el('pDesc').textContent = f.desc;
    var pk = el('pPicked');
    pk.hidden = state.picked.length === 0;
    pk.textContent = state.picked.length ? 'Con ' + state.picked.join(', ').toLowerCase() : '';
  }
  function renderSummary() {
    el('sumToppings').innerHTML = state.picked.length
      ? state.picked.map(function (t) {
          return '<button type="button" data-rm="' + t + '" class="rounded-full border-[1.5px] border-rose-600 bg-white px-3 py-1.5 text-sm font-medium text-rose-950">' + t + ' <span aria-hidden="true">×</span><span class="sr-only">Quitar</span></button>';
        }).join('')
      : '<span class="text-[0.9375rem] text-rose-900/70">Ninguno todavía. Elígelos arriba.</span>';
    var msg = 'Hola, quiero ordenar:\n• ' + FLAVORS[state.flavor].name +
              '\n• Tamaño: ' + SIZES[state.size].name +
              '\n• Toppings: ' + (state.picked.length ? state.picked.join(', ') : 'sin toppings');
    waUrl = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg);
    if (state.mode === 'b') el('mainBtn').href = waUrl;
  }
  function reveal(i) {
    if (reduce || !el('panel').animate) return;
    var c = ((i + 0.5) / FLAVORS.length) * 100, w = 100 / FLAVORS.length / 2;
    el('panel').animate(
      [{ clipPath: 'inset(0 ' + (100 - c - w) + '% 0 ' + (c - w) + '%)' }, { clipPath: 'inset(0 0 0 0)' }],
      { duration: 320, easing: 'cubic-bezier(.2,.7,.2,1)' }
    );
  }

  /* ---------- toppings ---------- */
  function toppingBtn(name, idx) {
    var tone = TONES[idx % TONES.length];
    return '<button type="button" data-t="' + name + '" aria-pressed="false" class="group flex w-[72px] flex-col items-center gap-1 border-0 bg-transparent p-0">' +
      '<span class="relative block h-[72px] w-[72px] rounded-full ring-[3px] ring-white transition-shadow group-aria-pressed:ring-rose-600">' +
        '<img src="' + GIF + '" alt="" class="h-full w-full rounded-full bg-gradient-to-br object-cover ' + tone + '">' +
        '<span class="absolute -right-0.5 -top-0.5 hidden h-5 w-5 items-center justify-center rounded-full bg-rose-600 text-[0.7rem] font-bold text-white group-aria-pressed:flex" aria-hidden="true">✓</span>' +
      '</span>' +
      '<span class="text-center text-[0.6875rem] font-semibold leading-tight">' + name + '</span></button>';
  }
  function renderGrid() {
    var top = TOPPINGS.slice(0, 7).map(function (n, i) { return toppingBtn(n, i); }).join('');
    var bottom = TOPPINGS.slice(7).map(function (n, i) { return toppingBtn(n, i + 7); }).join('');
    /* la fila de arriba (7) va corrida media celda para quedar entre las de abajo (8) */
    el('topRows').innerHTML =
      '<div class="flex gap-3 pl-[42px]">' + top + '</div>' +
      '<div class="flex gap-3">' + bottom + '</div>';
  }
  function setPicked(name, on) {
    var i = state.picked.indexOf(name);
    if (on && i === -1) state.picked.push(name);
    if (!on && i > -1) state.picked.splice(i, 1);
    var b = el('topRows').querySelector('[data-t="' + name + '"]');
    if (b) b.setAttribute('aria-pressed', String(on));
    renderSummary(); renderProduct();
  }
  /* el rosa se extiende como aceite y los toppings aparecen encima */
  function playOil() {
    if (reduce || !el('oil').animate) return;
    el('oil').animate(
      [{ clipPath: 'circle(0% at 0% 35%)' }, { clipPath: 'circle(150% at 0% 35%)' }],
      { duration: 1100, delay: 300, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'backwards' }
    );
    [].forEach.call(el('topRows').querySelectorAll('[data-t]'), function (b, i) {
      b.animate(
        [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }],
        { duration: 380, delay: 450 + i * 55, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }
      );
    });
  }

  /* ---------- cambio de pantalla (solo hero <-> toppings) ---------- */
  var anim = null, pendingOut = null;
  function finish() {
    if (pendingOut) { pendingOut.classList.add('h-0', 'overflow-hidden'); pendingOut.inert = true; pendingOut = null; }
    if (anim) { var a = anim; anim = null; a.cancel(); }
  }
  function show(which) {
    var toT = which === 'toppings';
    var inc = el(toT ? 'toppingsScreen' : 'heroScreen');
    var out = el(toT ? 'heroScreen' : 'toppingsScreen');
    var vp = el('viewport');
    finish();
    var h0 = vp.offsetHeight;
    inc.classList.remove('h-0', 'overflow-hidden'); inc.inert = false;
    var h1 = inc.offsetHeight;
    el('track').classList.toggle('-translate-x-1/2', !toT);
    try { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); } catch (e) {}
    if (toT) playOil();
    if (reduce || !vp.animate) { pendingOut = out; finish(); return; }
    pendingOut = out;
    /* la altura de la zona se ajusta sin saltos mientras se desliza */
    anim = vp.animate([{ height: h0 + 'px' }, { height: h1 + 'px' }],
      { duration: 500, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' });
    anim.onfinish = finish;
  }
  function setMode(m) {
    state.mode = m;
    el('panel').setAttribute('data-mode', m);
    el('mainBtn').href = m === 'b' ? waUrl : '#pedido';
    show(m === 'b' ? 'toppings' : 'hero');
  }

  /* ---------- eventos ---------- */
  el('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-i]'); if (!b) return;
    var i = +b.getAttribute('data-i');
    if (i === state.flavor) return;
    state.flavor = i;
    renderTabs(); renderProduct(); renderSummary(); reveal(i);
  });
  el('prev').addEventListener('click', function () { if (state.size > 0) { state.size--; renderSize(); renderSummary(); } });
  el('next').addEventListener('click', function () { if (state.size < SIZES.length - 1) { state.size++; renderSize(); renderSummary(); } });
  el('mainBtn').addEventListener('click', function (e) {
    if (state.mode === 'a') { e.preventDefault(); setMode('b'); }
  });
  el('backBtn').addEventListener('click', function () { setMode('a'); });
  el('topRows').addEventListener('click', function (e) {
    var b = e.target.closest('[data-t]'); if (!b) return;
    setPicked(b.getAttribute('data-t'), b.getAttribute('aria-pressed') !== 'true');
  });
  el('sumToppings').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rm]'); if (!b) return;
    setPicked(b.getAttribute('data-rm'), false);
  });

  renderTabs(); renderGrid(); renderSize(); renderProduct(); renderSummary();
</script>

</body></html>
